name: Generate a build and push to build branch

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Push
    steps:
      - name: git-checkout
        uses: actions/checkout@v3

      - name: Set Up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install all dependencies
        run: npm install

      - name: Build
        env:
          CI: false # Disable treating warnings as errors
        run: npm run build

      - name: Configure SSH Key and Clone Repository
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          mkdir -p /tmp/ssh
          ssh-keyscan github.com >> /tmp/ssh/known_hosts
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          ssh-add - <<< "$(echo -e "${{ secrets.SSH_PRIVATE_KEY }}")"
          git clone git@github.com:Fittlyf/Fittlyf_Website.git build-repo
        shell: bash

      - name: Publish to Build Repository
        run: |
          cd build-repo
          git config user.name "TechManTejas"
          git config user.email "techmantejas@gmail.com"
          rm -rf *
          cp -r ../build/* .
          git add .
          git commit -m "Update build"
          git push origin main